# RateEngine7 Docker containers
# author: Dimitar Kokov
# version: 0.2
# date: 2026-06-11

# docker-compose up --build -d
# docker-compose down -v

version: "3"

services:
  re7-db:
    image: re7-db-image
    build:
        context: re7-db/
        dockerfile: Dockerfile
    ports:
      - "5432:5432"
    networks:
      - re7_network
    volumes:
       - re7_pgdata:/var/lib/postgresql/data
    # PostgreSQL parallel workers (queries + VACUUM ANALYZE) allocate dynamic
    # shared memory in /dev/shm; Docker's 64M default is too small and causes
    # "could not resize shared memory segment ... No space left on device".
    shm_size: "512m"
    hostname: re7-db
    container_name: re7-db
    environment:
      - TZ=Europe/Sofia

  re7-core:
    image: re7-core-image
    build:
        context: ../
        dockerfile: docker/re7-core/Dockerfile
    ports:
      - "9090:9090"
      - "9092:9092"
      - "9093:9093"
    networks:
      - re7_network
    volumes:
      - re7_conf:/usr/local/RateEngine/config/
      - re7_logs:/usr/local/RateEngine/logs/
    hostname: re7-core
    container_name: re7-core
    depends_on:
      - re7-db
    environment:
      - TZ=Europe/Sofia

  re7-api-server:
    image: re7-api-server-image
    build:
        context: ../
        dockerfile: docker/re7-api-server/Dockerfile
    ports:
      - "8443:8443"
    networks:
      - re7_network
    volumes:
      - re7_api_data:/app/data
    hostname: re7-api-server
    container_name: re7-api-server
    depends_on:
      - re7-db
    environment:
      - TZ=Europe/Sofia
      # RE7 billing DB (the re7-db service)
      - RE7_DB_HOST=re7-db
      - RE7_DB_PORT=5432
      - RE7_DB_NAME=rate_engine
      - RE7_DB_USER=re_admin
      - RE7_DB_PASS=_cfg.access
      # JWT + seeded admin — CHANGE THESE for anything but local testing
      - JWT_SECRET=change_me_in_production
      - API_ADMIN_USER=admin
      - API_ADMIN_PASS=admin12345

networks:
  re7_network:
    driver: bridge

volumes:
  re7_pgdata:
  re7_conf:
  re7_logs:
  re7_api_data:
