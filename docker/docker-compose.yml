# RateEngine7 Docker containers
# author: Dimitar Kokov
# version: 0.3
# date: 2026-08-12

# docker-compose up --build -d
# docker-compose down -v

version: "3"

services:
  re7-db:
    image: re7-db-image
    build:
        context: re7-db/
        dockerfile: Dockerfile
    ports:
      - "5432:5432"
    networks:
      - re7_network
    volumes:
#       - re7_pgdata:/var/lib/postgresql/data
       # load the canonical schema on first init (empty data dir). v2 inserts a
       # 'version' row, so re7-core's own init sees the DB ready and skips its
       # (older) schema load — no double-load.
       - ../src/scripts/sql/rt_pgsql_v2.sql:/docker-entrypoint-initdb.d/10-rt_pgsql_v2.sql:ro
    # PostgreSQL parallel workers (queries + VACUUM ANALYZE) allocate dynamic
    # shared memory in /dev/shm; Docker's 64M default is too small and causes
    # "could not resize shared memory segment ... No space left on device".
    shm_size: "512m"
    hostname: re7-db
    container_name: re7-db
    environment:
      - TZ=Europe/Sofia
      - POSTGRES_DB=rate_engine
      - POSTGRES_USER=re_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}

  re7-core:
    image: re7-core-image
    build:
        context: ../
        dockerfile: docker/re7-core/Dockerfile
    ports:
      - "9090:9090"
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    networks:
      - re7_network
    volumes:
      - /var/lib/rate_engine/volumes/conf:/usr/local/RateEngine/config/
      - /var/lib/rate_engine/volumes/logs:/usr/local/RateEngine/logs/
      - /usr/src/test/RateEngine/:/usr/src/RateEngine/
    hostname: re7-core
    container_name: re7-core
    depends_on:
      - re7-db
    environment:
      - TZ=Europe/Sofia
      - RE7_DB_PASS=${RE7_DB_PASS:?set RE7_DB_PASS in docker/.env}

  re7-api-server:
    image: re7-api-server-image
    build:
        context: ../
        dockerfile: docker/re7-api-server/Dockerfile
    ports:
      - "8443:8443"
    networks:
      - re7_network
    hostname: re7-api-server
    container_name: re7-api-server
    depends_on:
      - re7-db
    environment:
      - TZ=Europe/Sofia
      # RE7 billing DB (the re7-db service)
      - RE7_DB_HOST=re7-db
      - RE7_DB_PORT=5432
      - RE7_DB_NAME=rate_engine
      - RE7_DB_USER=re_admin
      - RE7_DB_PASS=${RE7_DB_PASS:?set RE7_DB_PASS in docker/.env}
      # Secrets come from docker/.env (git-ignored). JWT_SECRET blank => the
      # entrypoint generates a strong one; set a >=32-char value to pin it.
      - JWT_SECRET=${JWT_SECRET:-}
      - API_ADMIN_USER=${API_ADMIN_USER:-admin}
      - API_ADMIN_PASS=${API_ADMIN_PASS:?set API_ADMIN_PASS in docker/.env}

networks:
  re7_network:
    driver: bridge

