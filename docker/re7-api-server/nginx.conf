# RE7 API server (container) — HTTPS only on :8443, front-controller only.
limit_req_zone $binary_remote_addr zone=re7api_login:10m rate=10r/m;

server {
    # 'listen ... http2' form works on the container's nginx 1.22 (bookworm)
    # as well as newer 1.25+ (where it is deprecated but still accepted).
    listen      8443 ssl http2;
    server_name _;

    ssl_certificate     /app/certs/server.crt;
    ssl_certificate_key /app/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    server_tokens off;

    root  /app/public;
    index index.php;
    client_max_body_size 2m;

    location = /auth/login {
        limit_req zone=re7api_login burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }
    location / {
        try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}
