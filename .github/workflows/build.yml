# RateEngine7 CI - build, install and start
# author: Dimitar Kokov
# date: 2026-06-12

name: Build and Test

on:
  push:
    branches: [ master, '0.7.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rate_engine
          POSTGRES_USER: re_admin
          POSTGRES_PASSWORD: ci_dev_only_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make \
            libxml2-dev libjson-c-dev libpq-dev postgresql-client

      - name: Build core
        working-directory: src
        run: make

      - name: Build modules
        working-directory: src
        run: make modules

      - name: Install
        working-directory: src
        run: sudo make install

      - name: Init database schema
        env:
          PGPASSWORD: ci_dev_only_pw
        # Use the COMMITTED schema (rt_pgsql_v2.sql: structure + generic lookups,
        # no customer data). Not rate_engine_0.6.13.sql - that file is untracked
        # (holds real customer data) and is absent in CI, so the old step
        # silently skipped DB init and left rate_engine schema-less.
        run: psql -v ON_ERROR_STOP=1 -h localhost -U re_admin rate_engine -f src/scripts/sql/rt_pgsql_v2.sql

      - name: Prepare config for CI
        run: |
          sudo sed -i 's/your_hostname/localhost/' /usr/local/RateEngine/config/RateEngine7.xml
          sudo sed -i 's/your_dbname/rate_engine/' /usr/local/RateEngine/config/RateEngine7.xml
          sudo sed -i 's/your_user/re_admin/' /usr/local/RateEngine/config/RateEngine7.xml
          sudo sed -i 's/your_password/ci_dev_only_pw/' /usr/local/RateEngine/config/RateEngine7.xml

      - name: Start RateEngine (smoke test)
        run: |
          export LD_LIBRARY_PATH=/usr/local/RateEngine/libs:$LD_LIBRARY_PATH
          /usr/local/RateEngine/bin/RateEngine -c /usr/local/RateEngine/config/RateEngine7.xml -t db
          echo "Config test passed"

      - name: Verify modules installed
        run: |
          echo "Installed modules:"
          ls -la /usr/local/RateEngine/modules/
          echo "Core library:"
          ls -la /usr/local/RateEngine/libs/

      - name: Check version
        run: |
          export LD_LIBRARY_PATH=/usr/local/RateEngine/libs:$LD_LIBRARY_PATH
          /usr/local/RateEngine/bin/RateEngine -v

      - name: CallControl E2E (jsonrpc_cc over tcp + TLS/mTLS)
        env:
          RE_PREFIX: /usr/local/RateEngine
          DBTYPE: pgsql
          DBHOST: localhost
          DBNAME: rate_engine
          DBUSER: re_admin
          DBPASS: ci_dev_only_pw
          DBPORT: "5432"
        run: bash src/scripts/tests/e2e/run_e2e.sh

      - name: Offline rating regression (rt.so vs golden)
        env:
          RE_PREFIX: /usr/local/RateEngine
          DBHOST: localhost
          DBNAME: rate_engine
          DBUSER: re_admin
          DBPASS: ci_dev_only_pw
          DBPORT: "5432"
        run: bash src/scripts/tests/rating/run_rating_regression.sh

      # TEMPORARY diagnostic - remove once the abort is fixed.
      # '-f' dies with "*** buffer overflow detected ***" here but not in the
      # Debian 12 dev container, because Ubuntu's gcc enables _FORTIFY_SOURCE by
      # default and Debian's does not. The overflow is real and pre-existing;
      # this step captures the frame. continue-on-error so it never blocks CI.
      - name: Foreground abort backtrace (temporary diagnostic)
        continue-on-error: true
        run: |
          set -eu
          sudo apt-get install -y -qq gdb
          BIN=/usr/local/RateEngine/bin/RateEngine
          CFG=/usr/local/RateEngine/config/RateEngine7.xml
          LIBS=/usr/local/RateEngine/libs
          sudo rm -f /usr/local/RateEngine/logs/rate_engine.pid \
                     /usr/local/RateEngine/logs/rate_engine.log
          sudo timeout 90 env LD_LIBRARY_PATH="$LIBS" \
            gdb -q -batch -ex run -ex "thread apply all bt full" \
                --args "$BIN" -c "$CFG" -f || true
          echo "----- engine log -----"
          sudo tail -60 /usr/local/RateEngine/logs/rate_engine.log || true

      # Service mode ('-f'/'-d') is what a container or a systemd unit runs, and
      # it is the only path that exercises run_mode, the config-driven service
      # selection, the pid file lock and the signal shutdown. Every other test
      # here uses a one-shot CLI flag (-2c/-r/-t), so without this the whole
      # supervisor path is untested.
      - name: Foreground service mode (-f)
        run: |
          set -eu
          BIN=/usr/local/RateEngine/bin/RateEngine
          CFG=/usr/local/RateEngine/config/RateEngine7.xml
          PIDF=/usr/local/RateEngine/logs/rate_engine.pid
          RELOG=/usr/local/RateEngine/logs/rate_engine.log
          LIBS=/usr/local/RateEngine/libs

          # sudo drops LD_LIBRARY_PATH from the environment even with -E, so
          # pass it explicitly via env(1) on every invocation.
          re() { sudo env LD_LIBRARY_PATH="$LIBS" "$BIN" -c "$CFG" "$@"; }

          sudo rm -f "$PIDF" "$RELOG"

          # 'timeout' is a backstop: if -f ever fails to stay up (or to exit),
          # the job must not hang for the full workflow timeout.
          re -f & JOB=$!

          for _ in $(seq 1 40); do
            sudo test -s "$PIDF" && break
            sleep 0.5
          done
          sudo test -s "$PIDF" || { echo "FAIL: -f wrote no pid file"; sudo tail -40 "$RELOG" || true; exit 1; }
          echo "pid file: $(sudo cat "$PIDF")"

          # the core must log which services it picked from the config
          sudo grep -q 'services from config:' "$RELOG" ||
            { echo "FAIL: no service-selection line"; sudo tail -40 "$RELOG"; exit 1; }

          # a second instance must be refused by the pid file lock
          if re -f 2>/tmp/second.err; then
            echo "FAIL: a second instance was allowed to start"; exit 1
          fi
          grep -q 'already running' /tmp/second.err ||
            { echo "FAIL: second instance did not report 'already running'"; cat /tmp/second.err; exit 1; }

          re --stat

          # -k must shut it down cleanly and clean up after itself
          re -k
          wait "$JOB" || { echo "FAIL: unclean shutdown"; sudo tail -40 "$RELOG"; exit 1; }
          sudo test ! -e "$PIDF" || { echo "FAIL: pid file left behind"; exit 1; }

          # and a crashed instance must not lock out the next start: the kernel
          # releases the lock on death, so a stale pid file is harmless
          re -f & JOB=$!
          for _ in $(seq 1 40); do sudo test -s "$PIDF" && break; sleep 0.5; done
          sudo test -s "$PIDF" || { echo "FAIL: no pid file on 2nd start"; exit 1; }
          sudo kill -KILL "$(sudo cat "$PIDF")" 2>/dev/null || true
          wait "$JOB" 2>/dev/null || true

          re -f & JOB=$!
          for _ in $(seq 1 40); do sudo test -s "$PIDF" && break; sleep 0.5; done
          sudo test -s "$PIDF" ||
            { echo "FAIL: stale pid file blocked restart after SIGKILL"; exit 1; }
          re -k
          wait "$JOB" || true

          echo "foreground service mode OK"

      # Broader billing-parity gate on a SYNTHETIC benchmark DB (no real data):
      # generate a small synthetic rating DB, then assert rt.so and rt_duckdb.so
      # bill identically over it. Synthetic-only by construction - SRCDB points at
      # the generated DB, and CI's Postgres holds no real data. (The throughput
      # tool bench_rating_replay.sh is intentionally NOT run in CI: it is a perf
      # benchmark, not a pass/fail gate.)
      - name: Build synthetic benchmark DB (small)
        env:
          RE_PREFIX: /usr/local/RateEngine
          DBHOST: localhost
          DBNAME: rate_engine        # maintenance connection only (CREATE DATABASE)
          DBUSER: re_admin
          DBPASS: ci_dev_only_pw
          DBPORT: "5432"
          BENCH_DB: re7_bench_ci
          N_ACCOUNTS: "2000"
          N_CDRS: "20000"
        run: bash src/scripts/tests/rating/gen_bench_db.sh

      - name: Rating parity on synthetic DB (rt.so vs rt_duckdb.so)
        env:
          RE_PREFIX: /usr/local/RateEngine
          DBHOST: localhost
          DBUSER: re_admin
          DBPASS: ci_dev_only_pw
          DBPORT: "5432"
          SRCDB: re7_bench_ci        # SYNTHETIC source (never a real DB)
          N: "5000"
          THREADS: "2"
        run: bash src/scripts/tests/rating/parity_real.sh

  # ---------------------------------------------------------------------------
  # Second-compiler check: build the whole engine with clang. clang is NOT a
  # production toolchain here (we ship gcc) - it runs purely as a static checker
  # that catches defects gcc stays quiet about. EXTRA_CFLAGS promotes real bugs
  # (e.g. a non-void function that falls off the end - undefined behaviour) to
  # hard errors so they fail CI instead of scrolling past as warnings. clang
  # uses -flto=thin (it has no -flto=auto).
  # ---------------------------------------------------------------------------
  build-clang:
    name: build with clang (second-compiler check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld make libxml2-dev libjson-c-dev libpq-dev

      - name: Build core + main (clang, warnings-as-errors)
        working-directory: src
        run: make CC=clang LTO=-flto=thin EXTRA_CFLAGS="-Wall -Werror=return-type"

      - name: Build modules (clang, warnings-as-errors)
        working-directory: src
        run: make CC=clang LTO=-flto=thin EXTRA_CFLAGS="-Wall -Werror=return-type" modules

  # ---------------------------------------------------------------------------
  # Compile-check the modules that are commented out in src/config.md, so they
  # are NOT built by `make modules` above and would otherwise rot silently.
  # Each entry builds the core lib (a `make module` prerequisite) + one module
  # with its own dev dependency. fail-fast: false so one broken module doesn't
  # hide the others.
  # ---------------------------------------------------------------------------
  module-matrix:
    name: build module (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db_mysql
            deps: default-libmysqlclient-dev
          - name: db_redis
            deps: libhiredis-dev
          - name: db_mongodb
            deps: libmongoc-dev libbson-dev
          - name: sctp
            deps: libsctp-dev
          - name: udp
            deps: ""
          - name: tls
            deps: libssl-dev
          # jsonrpc_rt is intentionally NOT in this matrix: it is an unfinished
          # v0.6-era stub (never ported to the current json_rpc API, and dead
          # code even if it compiled). Add it back here only once it is fixed.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Base deps for the core lib (a `make module` prerequisite) + this
          # module's own dev package.
          sudo apt-get install -y --no-install-recommends \
            build-essential libxml2-dev libjson-c-dev ${{ matrix.deps }}

      - name: Build module ${{ matrix.name }}
        working-directory: src
        run: make module name=${{ matrix.name }}
